name: 新增组件提案
description: 提议一个 Antdv Next Pro 尚未提供的新组件
title: '[组件提案] '
labels:
  - feature
  - component
body:
  - type: markdown
    attributes:
      value: |
        感谢你参与扩展组件征集计划！请尽量完整填写以下信息。
        提交前可先阅读 [讨论 #426](https://github.com/antdv-next/antdv-next/discussions/426)。

  - type: input
    id: component-name
    attributes:
      label: 组件名称
      description: 请填写组件的中英文名称。
      placeholder: 例如：高级表格 AdvancedTable
    validations:
      required: true

  - type: input
    id: component-identifier
    attributes:
      label: 组件标识
      description: 建议使用小写英文和连字符，例如 advanced-table。
      placeholder: advanced-table
    validations:
      required: true

  - type: dropdown
    id: similar-component
    attributes:
      label: 是否已有类似组件
      options:
        - 否
        - 是，我会在下方说明
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: 使用场景
      description: 描述组件解决的问题、典型业务场景以及现有方案的不足。
      placeholder: |
        - 场景一：
        - 场景二：
        - 现有方案不足：
    validations:
      required: true

  - type: textarea
    id: feature-design
    attributes:
      label: 功能设计
      description: 描述基础功能和可选的高级功能。
      placeholder: |
        基础功能：
        高级功能：
    validations:
      required: true

  - type: textarea
    id: api-proposal
    attributes:
      label: API 设计建议
      description: 如有想法，请描述 Props、Events、Slots 或实例方法。
      placeholder: |
        Props：
        Events：
        Slots：

  - type: textarea
    id: references
    attributes:
      label: 参考实现
      description: 可填写参考库、组件链接，以及它们的优点和不足。

  - type: textarea
    id: design-notes
    attributes:
      label: 设计补充
      description: 可填写设计稿、原型或复杂交互说明。

  - type: checkboxes
    id: participation
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意参与开发
        - label: 我仅提供想法

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认该提案不是 Ant Design 或 Antdv Next 已有组件的简单重复
          required: true
        - label: 我已尽量提供了可验证的使用场景
          required: true
