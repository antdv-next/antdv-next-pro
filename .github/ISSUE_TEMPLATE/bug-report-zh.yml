name: Bug 修复
description: 报告 Antdv Next Pro 中可复现的问题
title: '[Bug] '
labels:
  - bug
  - component
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈问题。请尽量提供最小复现，以便快速定位。

  - type: input
    id: component
    attributes:
      label: 相关组件
      placeholder: 例如：Scrollbar
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本信息
      placeholder: 例如：@antdv-next/pro 0.1.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 请填写浏览器、操作系统、Vue 和 Node.js 版本等信息。
      placeholder: Chrome 130 / Windows 11 / Vue 3.5 / Node 22
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: 实际结果
      description: 清晰描述发生了什么，并附上错误信息或日志。
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期结果
      description: 清晰描述你认为应该发生什么。
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 复现步骤
      description: 按顺序列出可以稳定复现问题的步骤。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: reproduction-link
    attributes:
      label: 在线复现链接
      description: 可填写 StackBlitz、CodeSandbox 或其他可访问链接。

  - type: textarea
    id: attachments
    attributes:
      label: 截图、日志或补充信息
      description: 可直接拖入截图、录屏或相关日志。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复报告
          required: true
        - label: 我已提供了可复现问题所需的最小信息
          required: true
